name: Awardhacks daglig sjekk

on:
  schedule:
    # Kjører 06:30 UTC = 07:30 norsk vintertid / 08:30 sommertid
    - cron: "30 6 * * *"
  workflow_dispatch: {}  # lar deg trigge manuelt fra Actions-fanen for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Kjør sjekk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_awardhacks.py
