name: Utforsk awardhacks.se skjema (Playwright)

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Kjør oppdagelses-script
        run: python scripts/discover_form.py
