name: Telegram-bot polling

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Sjekk for nye kommandoer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bot.py

      - name: Lagre offset-fil (hvis endret)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain scripts/telegram_offset.txt)" ]; then
            git add scripts/telegram_offset.txt
            git commit -m "Oppdater Telegram-offset [skip ci]"
            git push
          else
            echo "Ingen endring i offset-filen."
          fi
